<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Customer Registration - Your Playmate Sock Dolls</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="site-header">
        <h1>New Customer Setup</h1>
    </header>

    <main class="container">
        <section class="form-card">
            <h2>Create Your Profile</h2>
            <form id="registerForm">
                <label for="name">First Name</label>
                <input type="text" id="name" required />

                <label for="name">Last Name</label>
                <input type="text" id="name" required />

                <label for="email">Email Address</label>
                <input type="email" id="email" required />

                <label for="address">Shipping Address</label>
                <input type="text" id="address" required />

                <label for="password">Password</label>
                <input type="password" id="password" required />

                <label for="password">Re-Enter Password</label>
                <input type="password" id="password" required />

                <button type="submit" class="btn">Register</button>
            </form>

            <div id="registerMessage" class="success-message" style="display:none;">
                Registration successful! Redirecting to homepage...
            </div>
        </section>
        <div style="text-align: center; margin-top: 2rem;">
            <a href="index.html" class="button">Return to Home</a>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Your Playmate Sock Dolls, LLC</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            document.getElementById('registerMessage').style.display = 'block';
            setTimeout(() => window.location.href = 'index.html', 2000);
        });
    </script>
</body>
</html>
